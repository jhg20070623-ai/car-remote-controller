<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4f8fc">
  <meta name="description" content="通过 BLE 按住控制双轮小车。">
  <title>小车遥控器</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f2f7fc;
      --surface: #ffffff;
      --ink: #15314d;
      --muted: #688099;
      --line: #d9e5f0;
      --blue: #1768c7;
      --blue-deep: #1057aa;
      --blue-soft: #e8f2fc;
      --cyan: #188eae;
      --red: #c93849;
      --red-deep: #aa2939;
      --green: #18845e;
      --shadow: 0 14px 36px rgba(29, 68, 105, .08);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-height: 100%; margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--page);
      color: var(--ink);
    }

    button { font: inherit; }

    .app {
      width: min(100%, 460px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 20px max(14px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .topbar {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand { display: flex; align-items: center; gap: 11px; }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid #c6dced;
      border-radius: 12px;
      background: #e5f1fb;
      color: var(--blue);
    }

    .brand-mark svg { width: 23px; height: 23px; }
    .brand-copy h1 { margin: 0; font-size: 19px; line-height: 1.2; letter-spacing: .02em; }
    .brand-copy p { margin: 3px 0 0; color: var(--muted); font-size: 11px; letter-spacing: .12em; }

    .connection {
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .connection-info { min-width: 0; }

    .status-line { display: flex; align-items: center; gap: 9px; }

    .status-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #9baebe;
      box-shadow: 0 0 0 4px #edf2f6;
    }

    .status[data-state="connecting"] .status-dot {
      background: #d28b22;
      box-shadow: 0 0 0 4px #fff5df;
      animation: pulse 1.1s ease-in-out infinite;
    }

    .status[data-state="connected"] .status-dot {
      background: var(--green);
      box-shadow: 0 0 0 4px #e4f5ed;
    }

    .status[data-state="disconnected"] .status-dot {
      background: var(--red);
      box-shadow: 0 0 0 4px #fff0f1;
    }

    .status-label { font-size: 15px; font-weight: 750; }

    .connection-detail {
      min-height: 17px;
      margin: 7px 0 0 19px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      text-overflow: ellipsis;
    }

    .connect-button {
      min-width: 112px;
      min-height: 46px;
      padding: 0 16px;
      border: 0;
      border-radius: 13px;
      background: var(--blue);
      color: white;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color .12s ease, transform .12s ease;
    }

    .connect-button:active { background: var(--blue-deep); transform: scale(.98); }
    .connect-button:disabled { background: #91a9c1; cursor: wait; }

    .drive-section {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 3px 0;
    }

    .section-label {
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .section-label::after {
      width: 34%;
      height: 1px;
      background: var(--line);
      content: "";
    }

    .pad {
      width: min(100%, 330px);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, 88px);
      gap: 10px;
      justify-items: center;
      align-items: center;
    }

    .drive-button {
      width: 88px;
      height: 88px;
      padding: 9px 4px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: 1px solid #c9daea;
      border-radius: 23px;
      background: var(--surface);
      color: var(--blue);
      box-shadow: 0 5px 0 #dce8f2;
      cursor: pointer;
      touch-action: none;
      transition: background-color .1s ease, color .1s ease, box-shadow .1s ease, transform .1s ease;
    }

    .drive-button svg { width: 29px; height: 29px; stroke: currentColor; }
    .drive-button span { font-size: 13px; font-weight: 750; line-height: 1.1; }

    .drive-button.forward {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
      box-shadow: 0 5px 0 var(--blue-deep);
    }

    .drive-button:active,
    .drive-button.is-active {
      transform: translateY(4px);
      background: var(--blue-soft);
      color: var(--blue-deep);
      box-shadow: 0 1px 0 #cbdce9;
    }

    .drive-button.forward:active,
    .drive-button.forward.is-active {
      background: var(--blue-deep);
      color: white;
      box-shadow: 0 1px 0 #0c478d;
    }

    .drive-button:disabled { opacity: .48; cursor: not-allowed; }
    .up { grid-column: 2; grid-row: 1; }
    .left { grid-column: 1; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }
    .down { grid-column: 2; grid-row: 3; }

    .stop-button {
      width: min(100%, 286px);
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      border: 0;
      border-radius: 17px;
      background: var(--red);
      color: #fff;
      box-shadow: 0 5px 0 var(--red-deep);
      cursor: pointer;
      font-size: 17px;
      font-weight: 850;
      letter-spacing: .12em;
      touch-action: none;
      transition: background-color .1s ease, transform .1s ease, box-shadow .1s ease;
    }

    .stop-icon { width: 15px; height: 15px; border-radius: 3px; background: currentColor; }
    .stop-button:active { transform: translateY(4px); background: var(--red-deep); box-shadow: 0 1px 0 #8d2030; }
    .stop-button:disabled { opacity: .48; cursor: not-allowed; }

    .footer-note {
      min-height: 18px;
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    .connect-button:focus-visible,
    .drive-button:focus-visible,
    .stop-button:focus-visible {
      outline: 3px solid #72b5e7;
      outline-offset: 4px;
    }

    @keyframes pulse { 50% { opacity: .45; } }

    @media (max-height: 720px) {
      .app { gap: 12px; padding-top: max(12px, env(safe-area-inset-top)); }
      .drive-section { gap: 10px; }
      .pad { grid-template-rows: repeat(3, 76px); gap: 7px; }
      .drive-button { width: 76px; height: 76px; border-radius: 21px; }
      .stop-button { min-height: 56px; }
    }

    @media (max-width: 360px) {
      .app { padding-left: 14px; padding-right: 14px; }
      .connection { padding: 11px; }
      .connect-button { min-width: 102px; padding: 0 11px; }
      .pad { grid-template-rows: repeat(3, 76px); gap: 6px; }
      .drive-button { width: 76px; height: 76px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app" aria-labelledby="page-title">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 15.5 7 9h10l2 6.5"/><path d="M4 15.5h16v3H4z"/><circle cx="8" cy="18.5" r="1.5" fill="currentColor"/><circle cx="16" cy="18.5" r="1.5" fill="currentColor"/><path d="M12 3v4m-2-2 2 2 2-2"/>
          </svg>
        </div>
        <div class="brand-copy">
          <h1 id="page-title">小车遥控器</h1>
          <p>BLE · HOLD TO DRIVE</p>
        </div>
      </div>
    </header>

    <section class="connection" aria-label="蓝牙连接">
      <div class="connection-info status" id="connection-status" data-state="idle" role="status" aria-live="polite">
        <div class="status-line"><span class="status-dot" aria-hidden="true"></span><span class="status-label" id="status-label">未连接</span></div>
        <p class="connection-detail" id="connection-detail">连接小车后，按住方向键行驶</p>
      </div>
      <button class="connect-button" id="connect-button" type="button">连接小车</button>
    </section>

    <section class="drive-section" aria-label="方向控制">
      <div class="section-label"><span>方向控制</span></div>
      <div class="pad" id="control-pad">
        <button class="drive-button forward up" type="button" data-command="F" aria-label="按住前进，松开停止" disabled>
          <svg viewBox="0 0 32 32" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 26V6m0 0L7.5 14.5M16 6l8.5 8.5"/></svg>
          <span>前进</span>
        </button>
        <button class="drive-button left" type="button" data-command="L" aria-label="按住左转，松开停止" disabled>
          <svg viewBox="0 0 32 32" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M26 16H6m0 0 8.5-8.5M6 16l8.5 8.5"/></svg>
          <span>左转</span>
        </button>
        <button class="drive-button right" type="button" data-command="R" aria-label="按住右转，松开停止" disabled>
          <svg viewBox="0 0 32 32" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16h20m0 0-8.5-8.5M26 16l-8.5 8.5"/></svg>
          <span>右转</span>
        </button>
        <button class="drive-button down" type="button" data-command="B" aria-label="按住后退，松开停止" disabled>
          <svg viewBox="0 0 32 32" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 6v20m0 0 8.5-8.5M16 26l-8.5-8.5"/></svg>
          <span>后退</span>
        </button>
      </div>
      <button class="stop-button" id="stop-button" type="button" disabled><span class="stop-icon" aria-hidden="true"></span><span>STOP</span></button>
    </section>

    <p class="footer-note" id="footer-note">松开方向键立即停车 · 连接中断后车辆会自动停车</p>
  </main>

  <script>
    (() => {
      "use strict";

      const SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
      const CHARACTERISTIC_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";
      const HEARTBEAT_MS = 150;

      const statusBox = document.getElementById("connection-status");
      const statusLabel = document.getElementById("status-label");
      const detail = document.getElementById("connection-detail");
      const connectButton = document.getElementById("connect-button");
      const stopButton = document.getElementById("stop-button");
      const directionButtons = [...document.querySelectorAll(".drive-button")];
      const footerNote = document.getElementById("footer-note");

      let connectionState = "idle";
      let bleDevice = null;
      let commandCharacteristic = null;
      let activeButton = null;
      let activePointerId = null;
      let repeatTimer = null;
      let pendingCommand = null;
      let writeBusy = false;

      const labels = {
        idle: "未连接",
        connecting: "正在连接",
        connected: "已连接",
        disconnected: "已断开"
      };

      function renderState(state, message) {
        connectionState = state;
        statusBox.dataset.state = state;
        statusLabel.textContent = labels[state];
        detail.textContent = message;
        connectButton.textContent = state === "connected" ? "断开连接" : "连接小车";
        connectButton.disabled = state === "connecting";
        const enabled = state === "connected";
        for (const button of directionButtons) button.disabled = !enabled;
        stopButton.disabled = !enabled;
      }

      function isConnected() {
        return connectionState === "connected"
          && !!bleDevice?.gatt?.connected
          && !!commandCharacteristic;
      }

      async function writeByte(characteristic, command) {
        if (!characteristic.properties.write && !characteristic.properties.writeWithoutResponse) {
          throw new Error("FFE1 特征值没有可用的写入属性");
        }
        const byte = new Uint8Array([command.charCodeAt(0)]);
        if (characteristic.properties.write && typeof characteristic.writeValueWithResponse === "function") {
          await characteristic.writeValueWithResponse(byte);
        } else if (characteristic.properties.writeWithoutResponse && typeof characteristic.writeValueWithoutResponse === "function") {
          await characteristic.writeValueWithoutResponse(byte);
        } else if (typeof characteristic.writeValue === "function") {
          await characteristic.writeValue(byte);
        } else {
          throw new Error("当前浏览器不支持 GATT 特征值写入");
        }
      }

      function queueCommand(command) {
        if (!isConnected()) return false;
        pendingCommand = command;
        if (!writeBusy) void flushWrites();
        return true;
      }

      async function flushWrites() {
        if (writeBusy) return;
        writeBusy = true;
        try {
          while (pendingCommand !== null && isConnected()) {
            const command = pendingCommand;
            const characteristic = commandCharacteristic;
            const device = bleDevice;
            pendingCommand = null;
            try {
              await writeByte(characteristic, command);
            } catch (error) {
              pendingCommand = null;
              if (characteristic === commandCharacteristic && device === bleDevice) {
                clearMotion(false);
                footerNote.textContent = "发送失败；请检查蓝牙连接后重新连接";
                console.error("BLE write failed", error);
              }
              break;
            }
          }
        } finally {
          writeBusy = false;
          if (pendingCommand !== null && isConnected()) void flushWrites();
        }
      }

      function clearMotion(sendStop) {
        if (repeatTimer !== null) {
          window.clearInterval(repeatTimer);
          repeatTimer = null;
        }
        const oldButton = activeButton;
        const pointerId = activePointerId;
        activeButton = null;
        activePointerId = null;
        oldButton?.classList.remove("is-active");
        if (oldButton && pointerId !== null && oldButton.hasPointerCapture?.(pointerId)) {
          try { oldButton.releasePointerCapture(pointerId); } catch (_) { /* already released */ }
        }
        if (sendStop) queueCommand("S");
      }

      function startMotion(event, button) {
        if (!isConnected() || !button || button.disabled) return;
        if (event.cancelable) event.preventDefault();
        if (event.isPrimary === false || (event.pointerId !== undefined && event.button !== 0)) return;
        if (activeButton === button) return;
        if (activeButton) return; // One deliberate direction at a time.

        activeButton = button;
        activePointerId = event.pointerId ?? null;
        const command = button.dataset.command;
        button.classList.add("is-active");
        if (activePointerId !== null) {
          try { button.setPointerCapture(activePointerId); } catch (_) { /* pointer may already be released */ }
        }

        queueCommand(command);
        repeatTimer = window.setInterval(() => {
          if (activeButton === button && isConnected()) queueCommand(command);
        }, HEARTBEAT_MS);
      }

      function onDeviceDisconnected(event) {
        if (event?.target && bleDevice && event.target !== bleDevice) return;
        clearMotion(false);
        pendingCommand = null;
        commandCharacteristic = null;
        renderState("disconnected", "蓝牙连接已断开；重新连接后可继续遥控");
      }

      async function connectToCar() {
        if (!window.isSecureContext && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
          renderState("idle", "BLE 需要 HTTPS；此地址仅可预览页面");
          return;
        }
        if (!navigator.bluetooth) {
          renderState("idle", "此浏览器未提供 Web Bluetooth；请用 Android Chrome 的 HTTPS 页面打开");
          return;
        }

        renderState("connecting", "请在系统弹窗中选择小车蓝牙设备");
        try {
          const selectedDevice = await navigator.bluetooth.requestDevice({
            // Some UART BLE modules expose FFE0 after connecting but omit it
            // from their advertising packet. Show nearby devices, then verify
            // the required FFE0/FFE1 GATT service after the user selects one.
            acceptAllDevices: true,
            optionalServices: [SERVICE_UUID]
          });
          bleDevice = selectedDevice;
          selectedDevice.addEventListener("gattserverdisconnected", onDeviceDisconnected);
          const server = await selectedDevice.gatt.connect();
          const service = await server.getPrimaryService(SERVICE_UUID);
          const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
          if (!characteristic.properties.write && !characteristic.properties.writeWithoutResponse) {
            throw new Error("FFE1 不支持写入");
          }
          commandCharacteristic = characteristic;
          renderState("connected", `${selectedDevice.name || "BLE 小车"} · 按住行驶，松开即停`);
          footerNote.textContent = "松开方向键立即停车 · 连接中断后车辆会自动停车";
          queueCommand("S");
        } catch (error) {
          if (bleDevice?.gatt?.connected) bleDevice.gatt.disconnect();
          commandCharacteristic = null;
          bleDevice = null;
          if (error?.name === "NotFoundError") {
            renderState("idle", "未选择设备");
          } else {
            renderState("idle", error?.message || "连接失败；请重试");
            console.error("BLE connection failed", error);
          }
        }
      }

      async function disconnectFromCar() {
        clearMotion(false);
        queueCommand("S");
        const oldDevice = bleDevice;
        const deadline = Date.now() + 450;
        while ((writeBusy || pendingCommand !== null) && Date.now() < deadline) {
          await new Promise(resolve => window.setTimeout(resolve, 10));
        }
        if (oldDevice?.gatt?.connected) oldDevice.gatt.disconnect();
        else onDeviceDisconnected();
      }

      connectButton.addEventListener("click", () => {
        if (connectionState === "connected") void disconnectFromCar();
        else if (connectionState !== "connecting") void connectToCar();
      });

      for (const button of directionButtons) {
        button.addEventListener("pointerdown", event => startMotion(event, button));
        button.addEventListener("pointerup", () => { if (activeButton === button) clearMotion(true); });
        button.addEventListener("pointercancel", () => { if (activeButton === button) clearMotion(true); });
        button.addEventListener("lostpointercapture", () => { if (activeButton === button) clearMotion(true); });
        button.addEventListener("click", event => {
          // Screen readers and keyboard activation may synthesize a click without pointer events.
          if (event.detail === 0 && isConnected()) {
            queueCommand(button.dataset.command);
            window.setTimeout(() => queueCommand("S"), HEARTBEAT_MS);
          }
        });
      }

      function pressStop(event) {
        if (event?.cancelable) event.preventDefault();
        clearMotion(false);
        queueCommand("S");
      }

      stopButton.addEventListener("pointerdown", pressStop);
      stopButton.addEventListener("click", event => { if (event.detail === 0) pressStop(event); });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") clearMotion(true);
      });
      window.addEventListener("blur", () => clearMotion(true));
      window.addEventListener("pagehide", () => clearMotion(true));
      window.addEventListener("beforeunload", () => clearMotion(true));
      window.addEventListener("contextmenu", event => event.preventDefault());
      window.addEventListener("gesturestart", event => event.preventDefault(), { passive: false });

      if (!window.isSecureContext && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        footerNote.textContent = "BLE 遥控需通过 HTTPS 打开；HTTP 仅供页面预览";
      } else if (!navigator.bluetooth) {
        footerNote.textContent = "当前浏览器不支持 Web Bluetooth；请使用 Android Chrome";
      }
    })();
  </script>
</body>
</html>
